name: Bug 报告
description: 安装失败、黑屏、崩溃、画面异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看已知问题与 FAQ，避免重复。
        请勿上传游戏本体、BIOS、密钥或含个人目录的完整日志。
  - type: input
    id: patch_version
    attributes:
      label: 补丁版本
      description: 安装器或 Release 页面显示的版本号
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: output_hash
    attributes:
      label: 成品 ISO SHA-256
      description: 安装完成后安装器显示的哈希
      placeholder: 64 位十六进制
    validations:
      required: false
  - type: input
    id: source_hash
    attributes:
      label: 原版 ISO SHA-256
      placeholder: 64 位十六进制
    validations:
      required: true
  - type: input
    id: emulator
    attributes:
      label: 模拟器与版本
      placeholder: PCSX2 2.x，渲染器 Vulkan
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 出问题的阶段
      options:
        - 安装补丁
        - 启动 / 标题画面
        - 主菜单
        - 剧情与对话
        - 战斗
        - 存档 / 读档
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 载入成品 ISO
        2. 进入第 X 话
        3. ……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望表现
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际表现
      description: 有截图请附上，但不要上传完整镜像
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我使用的是未修改的日版原版 ISO 打的补丁
          required: true
        - label: 我已阅读已知问题与 FAQ
          required: true
